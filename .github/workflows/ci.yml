# SPDX-License-Identifier: GPL-2.0-or-later
#
# lint: syntax, C helpers, --help texts and licence lines on Arch Linux,
# Fedora, Debian testing (containers) and Ubuntu 26.04 (the runner itself),
# on every push and pull request.
# ntfs-next: builds linkinjeon/ntfs.git ntfs-next as a debug kernel and runs
# the reproducers in QEMU with KVM, on Arch Linux and on Ubuntu 26.04, split
# over four runners per distribution (one VM per runner: two VMs on one
# 4-vCPU runner slowed each other down up to threefold). The results job
# fails when a result differs from tests/expected/ntfs-next.txt (a
# regression, or a fix that landed upstream). Runs on pushes to master, on
# pull requests, weekly (ntfs-next moves without this repository changing)
# and by hand.
name: ci

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINT: |
    set -e
    for f in vm/*.sh tests/*.sh; do bash -n "$f"; done
    python3 -m py_compile tests/*.py vm/*.py
    make -C tests CFLAGS="-O2 -Wall -Werror"
    gcc -static -O2 -Wall -Werror -o "$RUNNER_TEMP/init" vm/init.c
    for f in vm/build_kernel.sh vm/run_vm.sh vm/check_patches.sh vm/kill_vm.sh \
             vm/apply_patches.sh vm/kernel_artifact.sh \
             tests/run_reproducers.sh tests/run_guest_script.sh tests/run_kernel_tests.sh \
             tests/compare_results.py tests/set_init_size.py tests/verify_tree.py \
             tests/shard.py; do
      "$f" --help > /dev/null
    done
    missing=$(grep -L "SPDX-License-Identifier: GPL-2.0-or-later" \
              vm/*.sh vm/*.py vm/*.c tests/*.sh tests/*.py tests/*.c tests/Makefile \
              .github/workflows/*.yml .github/actions/*/action.yml || true)
    if [ -n "$missing" ]; then echo "no SPDX line: $missing"; exit 1; fi

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm --needed gcc make python
          - distro: fedora
            image: fedora:latest
            install: dnf -y install gcc make glibc-static python3
          - distro: debian-testing
            image: debian:testing
            install: apt-get update && apt-get install -y --no-install-recommends gcc make libc6-dev python3
    name: lint (${{ matrix.distro }})
    runs-on: ubuntu-26.04
    container: ${{ matrix.image }}
    steps:
      - name: Packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@v7
      - name: Lint
        run: bash -c "$LINT"

  lint-ubuntu:
    name: lint (ubuntu-26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make libc6-dev python3
      - name: Lint
        run: bash -c "$LINT"
      - name: Workflow (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest -color

  build:
    needs: [lint, lint-ubuntu]
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    name: build (ntfs-next)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kernel
        with:
          distro: ubuntu-26.04
          tools: "false"
          save-cache: "true"
      - name: Pack the kernel
        run: vm/kernel_artifact.sh pack "$RUNNER_TEMP/build" kernel.tar "$RUNNER_TEMP/ntfs"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: kernel.tar
          retention-days: 7

  ntfs-next:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, ubuntu-26.04]
        shard: [1, 2, 3, 4]
    name: ntfs-next (${{ matrix.distro }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    container:
      image: ${{ matrix.distro == 'arch' && 'archlinux:latest' || '' }}
      options: --device /dev/kvm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kernel
          path: ${{ runner.temp }}/kernel
      - uses: ./.github/actions/kernel
        with:
          distro: ${{ matrix.distro }}
          build: "false"
      - name: Unpack the kernel
        run: vm/kernel_artifact.sh unpack "$RUNNER_TEMP/kernel/kernel.tar" "$RUNNER_TEMP/build"
      - name: Reproducers
        env:
          DMESG_IGNORE: slab_common.c:111
          SHARD: ${{ matrix.shard }}/4
        run: |
          export NTFSCK="$RUNNER_TEMP/ntfsprogs-plus-root/sbin/ntfsck"
          export NTFSINFO="$RUNNER_TEMP/ntfsprogs-plus-root/bin/ntfsinfo"
          tests/run_reproducers.sh "$RUNNER_TEMP/build" repro-out |
            tee results-${{ matrix.shard }}.txt || true
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducer-logs-${{ matrix.distro }}-${{ matrix.shard }}
          path: |
            results-${{ matrix.shard }}.txt
            repro-out/*.log
            repro-out/*/*.log
            repro-out/*/run.out
            repro-out/*/check.out
            repro-out/*/fstests-results/
          if-no-files-found: ignore

  results:
    needs: ntfs-next
    if: ${{ !cancelled() && needs.ntfs-next.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, ubuntu-26.04]
    name: ntfs-next results (${{ matrix.distro }})
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: reproducer-logs-${{ matrix.distro }}-*
          merge-multiple: true
          path: logs
      - name: Compare with tests/expected/ntfs-next.txt
        run: |
          cat logs/results-*.txt | sort > results.txt
          cat results.txt
          tests/compare_results.py tests/expected/ntfs-next.txt results.txt
